name: Resolve targeted web lock
on:
  push:
    branches: [fix/postcss-advisories]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3'}
      - run: npm view postcss@8.5.23 version dist.integrity --json
      - run: npm install --prefix apps/web --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: python scripts/emit_web_lock.py
