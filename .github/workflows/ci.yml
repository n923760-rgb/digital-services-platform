name: Foundation CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://platform:ci-password@localhost:5432/platform
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: pip wheel --no-deps -w /tmp/platform-wheels .
      - run: ruff check apps packages tests migrations
      - run: alembic upgrade head
      - run: pytest -q
      - run: alembic current
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: >-
          docker compose config --format json |
          python -c 'import json,sys; s=json.load(sys.stdin)["services"]["pdf-sandbox"];
          assert s["network_mode"]=="none" and s["read_only"] is True;
          assert not {"DATABASE_URL","TELEGRAM_BOT_TOKEN","OBJECT_STORAGE_SECRET_KEY"}
          & set(s.get("environment",{}))'
      - run: >-
          docker compose config --format json |
          python -c 'import json,sys; s=json.load(sys.stdin)["services"]["backup"];
          assert s["read_only"] is True and s["user"]=="10001:10001";
          assert not {"DATABASE_URL","TELEGRAM_BOT_TOKEN","OBJECT_STORAGE_SECRET_KEY"}
          & set(s["environment"])'
      - run: docker compose up -d --build --wait db redis object-storage migrate backup api worker web caddy
      - run: docker compose run --rm -T -e CI_RESTORE_TEST=1 backup sh /backup-scripts/restore_smoke.sh
      - run: docker compose exec -T worker python -m platform_core.pdf_sandbox_smoke
      - run: curl --fail http://localhost/api/health/ready
      - run: curl --fail http://localhost/api/health/live
      - run: curl --fail http://localhost/web-health
      - if: always()
        run: docker compose logs --no-color --tail 100
