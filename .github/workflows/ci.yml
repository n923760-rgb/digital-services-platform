name: Foundation CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://platform:ci-password@localhost:5432/platform
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - run: python scripts/verify_dependency_artifacts.py
      - run: pip install --require-hashes -r requirements/build.txt
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pip check
      - run: pip wheel --no-deps --no-build-isolation -w /tmp/platform-wheels .
      - run: ruff check apps packages tests migrations scripts
      - run: alembic upgrade head
      - run: pytest -q
      - run: alembic current
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3'}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: >-
          docker compose config --format json |
          python -c 'import json,sys; s=json.load(sys.stdin)["services"]["pdf-sandbox"];
          assert s["network_mode"]=="none" and s["read_only"] is True;
          assert not {"DATABASE_URL","TELEGRAM_BOT_TOKEN","OBJECT_STORAGE_SECRET_KEY"}
          & set(s.get("environment",{}))'
      - run: >-
          docker compose config --format json |
          python -c 'import json,sys; s=json.load(sys.stdin)["services"]["backup"];
          assert s["read_only"] is True and s["user"]=="10001:10001";
          assert not {"DATABASE_URL","TELEGRAM_BOT_TOKEN","OBJECT_STORAGE_SECRET_KEY"}
          & set(s["environment"])'
      - run: docker compose up -d --build --wait db redis object-storage migrate backup api worker web caddy
      - run: docker compose exec -T backup sh /backup-scripts/check_freshness.sh
      - run: docker compose run --rm -T -e CI_RESTORE_TEST=1 backup sh /backup-scripts/restore_smoke.sh
      - run: docker compose exec -T worker python -m platform_core.pdf_sandbox_smoke
      - run: docker compose exec -T -e CI_PROXY_TEST=1 worker python -m platform_core.proxy_smoke
      - run: docker compose run --rm -T -e CI_PROXY_TEST=1 migrate python -m platform_core.proxy_smoke
      - run: curl --fail http://localhost/api/health/ready
      - run: curl --fail http://localhost/api/health/live
      - run: curl --fail http://localhost/web-health
      - if: always()
        run: docker compose logs --no-color --tail 100
