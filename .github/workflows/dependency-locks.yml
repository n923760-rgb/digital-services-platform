name: Resolve dependency locks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3'}
      - run: pip install 'pip==25.1.1' 'pip-tools==7.5.0' 'setuptools==80.9.0' 'wheel==0.45.1'
      - run: pip-compile --quiet --generate-hashes --strip-extras --allow-unsafe --no-emit-index-url --no-emit-trusted-host --output-file requirements/runtime.txt pyproject.toml
      - run: pip-compile --quiet --generate-hashes --strip-extras --allow-unsafe --no-emit-index-url --no-emit-trusted-host --extra dev --constraint requirements/runtime.txt --output-file requirements/dev.txt pyproject.toml
      - run: pip-compile --quiet --generate-hashes --allow-unsafe --no-emit-index-url --no-emit-trusted-host --output-file requirements/build.txt requirements/build.in
      - run: python scripts/resolve_dependency_artifacts.py
