name: Dependency advisory audit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.23.3'}
      - run: python -m venv /tmp/dsp-audit-tools
      - run: /tmp/dsp-audit-tools/bin/pip install --require-hashes -r requirements/audit.txt
      - name: Audit pinned Python runtime requirements
        run: >-
          /tmp/dsp-audit-tools/bin/pip-audit --strict --disable-pip --require-hashes
          -r requirements/runtime.txt --format json --output /tmp/dsp-python-audit.json
      - run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - name: Audit npm production dependency graph
        working-directory: apps/web
        run: npm audit --omit=dev --json > /tmp/dsp-npm-audit.json
      - name: Record public advisory reports and exact source
        if: always()
        run: python scripts/check_dependency_audits.py
