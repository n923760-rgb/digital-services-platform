name: Telegram Stars reference
on:
  push:
    branches: [feat/telegram-stars-direct-payments]
    paths: [.github/workflows/stars-reference.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Read public official payment specifications without bot credentials
        run: |
          python3 - <<'PY'
          import hashlib
          import html
          import re
          import urllib.request

          for url in ["https://core.telegram.org/bots/payments-stars", "https://core.telegram.org/bots/api"]:
              with urllib.request.urlopen(url, timeout=30) as response:
                  body = response.read(4 * 1024 * 1024).decode()
              print("OFFICIAL_SOURCE", url, hashlib.sha256(body.encode()).hexdigest())
              if url.endswith("/api"):
                  for anchor in ["sendinvoice", "answerprecheckoutquery", "successfulpayment",
                                 "refundstarpayment", "refundedpayment", "getstartransactions",
                                 "startransaction", "transactionpartneruser"]:
                      match = re.search(r'<h4[^>]*>.*?name="' + anchor + r'".*?</h4>', body)
                      if not match:
                          raise RuntimeError("missing official API anchor: " + anchor)
                      end = body.find("<h4", match.end())
                      fragment = body[match.start():end]
                      print("API_SECTION", anchor, html.unescape(re.sub("<[^>]+>", " ", fragment)))
              else:
                  text = html.unescape(re.sub("<[^>]+>", " ", body))
                  for line in text.splitlines():
                      if re.search(r"XTR|provider.token|refund|pre.checkout|successful.payment|paysupport|/terms", line, re.I):
                          print("STARS_RULE", line.strip())
          PY
