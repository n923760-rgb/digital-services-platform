[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-services-platform"
version = "0.1.0"
description = "Channel-independent foundation for a Saudi digital services platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "aiogram>=3.15,<4",
  "asyncpg>=0.30,<1",
  "redis>=5,<7",
  "arq>=0.26,<1",
  "alembic>=1.14,<2",
  "SQLAlchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = [".", "packages/python"]
include = ["apps*", "platform_core*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
