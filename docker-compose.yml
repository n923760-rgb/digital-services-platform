name: digital-services-platform
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: {context: ., dockerfile: Dockerfile.python}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: Dockerfile.python}
    command: ["uvicorn", "apps.api.v0:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports: ["127.0.0.1:8100:8000"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "platform_core.healthcheck", "http://127.0.0.1:8000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
  telegram-bot:
    profiles: [telegram]
    build: {context: ., dockerfile: Dockerfile.python}
    command: ["python", "-m", "apps.telegram_bot.v0"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "platform_core.healthcheck", "file:///tmp/bot-heartbeat"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
