name: digital-services-platform
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  object-storage:
    # Development and CI only. Use a real S3 provider for production data.
    image: adobe/s3mock:5.2.2
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${OBJECT_STORAGE_BUCKET:?Set bucket}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes: [object_data:/s3mockroot]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build: {context: ., dockerfile: Dockerfile.python}
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: Dockerfile.python}
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      object-storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "platform_core.healthcheck", "http://127.0.0.1:8000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: {context: ., dockerfile: Dockerfile.python}
    command: ["arq", "platform_core.worker.WorkerSettings"]
    env_file: .env
    tmpfs:
      - /tmp:size=268435456,mode=1777
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "arq", "--check", "platform_core.worker.WorkerSettings"]
      interval: 20s
      timeout: 5s
      retries: 5
  telegram-bot:
    profiles: [telegram]
    build: {context: ., dockerfile: Dockerfile.python}
    command: ["python", "-m", "apps.telegram_bot.main"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "platform_core.healthcheck", "file:///tmp/bot-heartbeat"]
      interval: 20s
      timeout: 5s
      retries: 5
  web:
    build: {context: ./apps/web}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/web-health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
volumes:
  postgres_data:
  redis_data:
  object_data:
  caddy_data:
  caddy_config:
